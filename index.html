<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emprendimientos de Galápagos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap">
<style>
:root{--bg:#f6f8f4;--ink:#16271d;--muted:#4f6357;--line:#dfe6d6;--accent:#077b47}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif}
main{max-width:34rem;margin:0 auto;padding:3rem 18px}
h1{font-size:1.9rem;margin:0 0 .4rem}
p{color:var(--muted);margin:0 0 1.75rem}
a.card{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;margin-bottom:.6rem;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:700}
a.card:hover{border-color:var(--accent);color:var(--accent)}
a.card small{display:block;font-weight:500;color:var(--muted)}
footer{margin-top:2.5rem;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Emprendimientos de Galápagos</h1>
  <p>Catálogos digitales de emprendimientos locales.</p>
  <a class="card" href="green-island/"><span>Green Island<small>Conservas y chimichurris · San Cristóbal</small></span><span>→</span></a>
  <!-- Para agregar otro emprendimiento: copia la línea de arriba y cambia carpeta y nombre -->
  <footer>Con el apoyo de Fundación Heifer Ecuador</footer>
</main>
</body>
</html>
